name: Generate Snake Contribution Graph

on:
  schedule:
    # Tous les jours à minuit UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake game from GitHub contribution grid
        uses: Platane/snk@v3.3.0
        with:
          github_user_name: mouhamedlamotte
          github_token: ${{ github.token }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=blue
            dist/github-snake-light.svg?palette=github-light&color_snake=#7845ab
            dist/github-snake-ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Commit and push generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update snake contribution graph"
          branch: main
          file_pattern: dist/*
